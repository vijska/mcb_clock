<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Часы Мира Маня-КБ</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Тёмная тема (по умолчанию) */
        :root {
            --bg-color: #0f0f11;
            --card-bg: #18181c;
            --card-border: #2a2a30;
            --title-color: #6e6e7a;
            --primary-text: #f0f0f2;
            --secondary-text: #adadb8;
            --sub-text: #585863;
            --select-bg: #222228;
            --select-border: #33333d;
            --button-bg: #222228;
            --button-active-bg: #3a3a46;
            --button-active-text: #ffffff;
            --shadow: rgba(0, 0, 0, 0.25);
        }

        /* Светлая тема */
        [data-theme="light"] {
            --bg-color: #f4f4f6;
            --card-bg: #ffffff;
            --card-border: #e1e1e8;
            --title-color: #8e8e9a;
            --primary-text: #1a1a1e;
            --secondary-text: #4a4a52;
            --sub-text: #8a8a96;
            --select-bg: #f0f0f4;
            --select-border: #d1d1d9;
            --button-bg: #eaeaea;
            --button-active-bg: #1a1a1e;
            --button-active-text: #ffffff;
            --shadow: rgba(0, 0, 0, 0.05);
        }

        body {
            background-color: var(--bg-color);
            color: var(--primary-text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        .clock-wrapper {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .segment {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px 24px;
            text-align: center;
            box-shadow: 0 4px 20px var(--shadow);
            transition: background-color 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
        }

        .segment-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--title-color);
            margin-bottom: 8px;
            font-weight: 600;
        }

        /* Сегмент времени */
        .time-display {
            font-family: "SF Mono", "Roboto Mono", "Courier New", monospace;
            font-size: clamp(3rem, 10vw, 4.5rem);
            font-weight: 700;
            color: var(--primary-text);
            line-height: 1.1;
            letter-spacing: -0.02em;
        }

        /* Сегмент даты и сезона */
        .date-primary {
            font-size: clamp(1.3rem, 4vw, 1.7rem);
            font-weight: 600;
            color: var(--primary-text);
            margin-bottom: 4px;
        }

        .season-name {
            font-size: 1.05rem;
            color: var(--secondary-text);
            font-weight: 500;
        }

        .year-day-sub {
            font-size: 0.8rem;
            color: var(--sub-text);
            margin-top: 6px;
        }

        /* Сегмент дня недели */
        .weekday-display {
            font-size: 1.25rem;
            font-weight: 500;
            color: var(--secondary-text);
        }

        /* Сегмент настроек */
        .settings-segment {
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
            max-width: 320px;
            align-items: center;
        }

        .control-label {
            font-size: 0.75rem;
            color: var(--sub-text);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Переключатель темы (табы) */
        .theme-switcher {
            display: flex;
            background: var(--select-bg);
            border: 1px solid var(--select-border);
            border-radius: 8px;
            padding: 3px;
            width: 100%;
        }

        .theme-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--secondary-text);
            padding: 6px 10px;
            font-size: 0.82rem;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .theme-btn.active {
            background: var(--button-active-bg);
            color: var(--button-active-text);
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }

        .timezone-select {
            background: var(--select-bg);
            color: var(--primary-text);
            border: 1px solid var(--select-border);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
            width: 100%;
            font-family: inherit;
            transition: border-color 0.2s, background 0.2s;
        }

        .sync-status {
            font-size: 0.78rem;
            color: var(--sub-text);
        }

        @media (min-width: 540px) {
            .grid-row {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 16px;
            }
        }
    </style>
</head>
<body>

<div class="clock-wrapper">
    <!-- Время -->
    <div class="segment">
        <div class="segment-title">Время</div>
        <div class="time-display" id="world-time">--:--</div>
    </div>

    <!-- Адаптивная сетка -->
    <div class="grid-row">
        <!-- Дата и Сезон -->
        <div class="segment">
            <div class="segment-title">Дата и Сезон</div>
            <div class="date-primary" id="world-date">Синхронизация...</div>
            <div class="season-name" id="world-season">...</div>
            <div class="year-day-sub" id="world-year-day">...</div>
        </div>

        <!-- День недели -->
        <div class="segment" style="display: flex; flex-direction: column; justify-content: center;">
            <div class="segment-title">День недели</div>
            <div class="weekday-display" id="world-weekday">...</div>
        </div>
    </div>

    <!-- Настройки -->
    <div class="segment settings-segment">
        <div class="segment-title">Настройки и Синхронизация</div>
        
        <!-- Выбор темы -->
        <div class="control-group">
            <div class="control-label">Оформление</div>
            <div class="theme-switcher">
                <button class="theme-btn active" id="theme-auto" onclick="setThemeMode('auto')">Адаптивная</button>
                <button class="theme-btn" id="theme-dark" onclick="setThemeMode('dark')">Тёмная</button>
                <button class="theme-btn" id="theme-light" onclick="setThemeMode('light')">Светлая</button>
            </div>
        </div>

        <!-- Часовой пояс -->
        <div class="control-group">
            <div class="control-label">Часовой пояс</div>
            <select id="tz" class="timezone-select" onchange="updateWorldTime()"></select>
        </div>

        <div class="sync-status" id="sync-status">Сверяю часы с интернет-сервером...</div>
    </div>
</div>

<script>
    const DAY_MS = 10000000;          
    const YEAR_DAYS = 325;            
    const YEAR_MS = DAY_MS * YEAR_DAYS; 
    const HOUR_MS = 400000; 
    const MINUTE_MS = 8000; 

    const START_REAL_MS = Date.UTC(2026, 6, 14, 0, 0, 0); 
    const VIRTUAL_OFFSET_MS = 6 * YEAR_MS;

    const WEEKDAYS = [
        "Eitejür",
        "Täskörmajür",
        "Vädjastjür (Reeljür)",
        "Kuurajür (Skirajür)",
        "Käźisjür"
    ];

    const SEASONS = [
        "Сезон холодов",       
        "Сезон штормов",       
        "Сезон первых цветов", 
        "Сезон солнца",        
        "Сезон урожая (листопад)" 
    ];

    let timeCorrectionOffset = 0; 
    let currentThemeMode = 'auto'; // 'auto', 'dark', 'light'
    let lastCalculatedHour = 12;

    const select = document.getElementById('tz');
    for (let i = -12; i <= 12; i++) {
        let opt = document.createElement('option');
        opt.value = i;
        let zoneName = "VŚ" + (i > 0 ? `+${i}` : (i < 0 ? `${i}` : ''));
        opt.innerText = zoneName;
        if (i === 0) opt.selected = true; 
        select.appendChild(opt);
    }

    function setThemeMode(mode) {
        currentThemeMode = mode;
        ['auto', 'dark', 'light'].forEach(m => {
            const btn = document.getElementById(`theme-${m}`);
            if (m === mode) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
        applyTheme(lastCalculatedHour);
    }

    function applyTheme(hour) {
        let effectiveTheme = currentThemeMode;
        if (currentThemeMode === 'auto') {
            // Дневное время на часах мира: с 5 до 20 включительно
            if (hour >= 5 && hour <= 20) {
                effectiveTheme = 'light';
            } else {
                effectiveTheme = 'dark';
            }
        }
        document.body.setAttribute('data-theme', effectiveTheme);
    }

        const TIME_SERVERS = [
        {
            name: "WorldTimeAPI",
            url: "https://worldtimeapi.org/api/timezone/Etc/UTC",
            parse: data => data.unixtime * 1000
        },
        {
            name: "TimeAPI",
            url: "https://timeapi.io/api/v1/time/current/zone?timeZone=UTC",
            parse: data => {
                // Преобразуем ISO дату в миллисекунды
                return new Date(data.dateTime + "Z").getTime();
            }
        },
        {
            name: "WorldClockAPI",
            url: "https://worldclockapi.com/api/json/utc/now",
            parse: data => new Date(data.currentDateTime).getTime()
        }
    ];

    async function syncWithInternet() {
        const statusEl = document.getElementById('sync-status');
        let synced = false;

        for (const server of TIME_SERVERS) {
            try {
                // Таймаут 3 секунды на запрос, чтобы сайт не «залипал», если сервер лежит
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 3000);

                const response = await fetch(server.url, { signal: controller.signal });
                clearTimeout(timeoutId);

                if (!response.ok) throw new Error(Status ${response.status});

                const data = await response.json();
                const internetTimeMs = server.parse(data);
                const deviceTimeMs = Date.now();

                timeCorrectionOffset = internetTimeMs - deviceTimeMs;
                synced = true;

                if (Math.abs(timeCorrectionOffset) > 1000) {
                    statusEl.innerText = Синхронизировано (${server.name}). Коррекция ПК: ${(timeCorrectionOffset / 1000).toFixed(1)} сек.;
                    statusEl.style.color = '#d49b4b';
                } else {
                    statusEl.innerText = Синхронизировано по сети (${server.name}).;
                    statusEl.style.color = '#52ab6a';
                }

                // Успешно синхронизировались — выходим из цикла
                break;
            } catch (error) {
                console.warn(Сервер ${server.name} недоступен. Пробуем следующий..., error);
            }
        }

        // Если ни один из серверов не ответил
        if (!synced) {
            statusEl.innerText = "Все серверы времени недоступны. Используются часы ПК.";
            statusEl.style.color = '#c95353';
        }
    }

    function getSeasonInfo(dayOfYear) {
        if (dayOfYear <= 33) {
            return { name: SEASONS[0], day: dayOfYear + 32 };
        } else if (dayOfYear <= 98) {
            return { name: SEASONS[1], day: dayOfYear - 33 };
        } else if (dayOfYear <= 163) {
            return { name: SEASONS[2], day: dayOfYear - 98 };
        } else if (dayOfYear <= 228) {
            return { name: SEASONS[3], day: dayOfYear - 163 };
        } else if (dayOfYear <= 292) {
            return { name: SEASONS[4], day: dayOfYear - 228 };
        } else {
            return { name: SEASONS[0], day: dayOfYear - 292 };
        }
    }

    function updateWorldTime() {
        const accurateNow = Date.now() + timeCorrectionOffset;
        const selectedZone = parseInt(document.getElementById('tz').value) || 0;
        const zoneOffsetMs = selectedZone * HOUR_MS;

        let totalWorldMs = (accurateNow - START_REAL_MS) + VIRTUAL_OFFSET_MS + zoneOffsetMs;

        let currentYear = Math.floor(totalWorldMs / YEAR_MS) + 1;
        let currentDay = Math.floor((totalWorldMs % YEAR_MS) / DAY_MS) + 1;

        if (totalWorldMs < 0) {
            let positiveDays = Math.floor(totalWorldMs / DAY_MS);
            currentYear = Math.floor(positiveDays / YEAR_DAYS) + 7;
            currentDay = (positiveDays % YEAR_DAYS) + YEAR_DAYS + 1;
            if (currentDay > YEAR_DAYS) {
                currentDay -= YEAR_DAYS;
                currentYear += 1;
            }
        }

        const totalDaysFromEpoch = Math.floor(totalWorldMs / DAY_MS);
        const weekdayIndex = ((totalDaysFromEpoch % 5) + 5) % 5;

        const seasonInfo = getSeasonInfo(currentDay);

        let dayProgressMs = ((totalWorldMs % DAY_MS) + DAY_MS) % DAY_MS; 
        const currentHour = Math.floor(dayProgressMs / HOUR_MS);

        const hourProgressMs = dayProgressMs % HOUR_MS;
        const currentMinute = Math.floor(hourProgressMs / MINUTE_MS);

        const displayHour = currentHour.toString().padStart(2, '0');
        const displayMinute = currentMinute.toString().padStart(2, '0');

        lastCalculatedHour = currentHour;
        applyTheme(currentHour);

        document.getElementById('world-date').innerText = `${seasonInfo.day}-й день, ${currentYear} год`;
        document.getElementById('world-season').innerText = seasonInfo.name;
        document.getElementById('world-year-day').innerText = `Порядковый день: ${currentDay} из ${YEAR_DAYS}`;
        document.getElementById('world-weekday').innerText = WEEKDAYS[weekdayIndex];
        document.getElementById('world-time').innerText = `${displayHour}:${displayMinute}`;
    }

    updateWorldTime();
    setInterval(updateWorldTime, 100);
    syncWithInternet();
    setInterval(syncWithInternet, 600000); 
</script>

</body>
</html>
