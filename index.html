<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Часы Вымышленного Мира</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: #1e1e1e;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #333;
            width: 420px;
        }
        .date {
            font-size: 2.1rem;
            font-weight: bold;
            color: #00ffcc;
            margin-bottom: 2px;
        }
        .season {
            font-size: 1.3rem;
            color: #ff7700;
            margin-bottom: 2px;
            font-weight: 600;
        }
        .year-day-sub {
            font-size: 0.85rem;
            color: #aaaaaa;
            margin-bottom: 8px;
        }
        .weekday {
            font-size: 1.1rem;
            color: #888888;
            margin-bottom: 15px;
            font-weight: 500;
        }
        .time {
            font-size: 3.8rem;
            font-weight: bold;
            color: #ffaa00;
            font-family: monospace;
            margin-bottom: 25px;
        }
        .timezone-select {
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 1.1rem;
            outline: none;
            cursor: pointer;
            width: 100%;
            font-family: monospace;
            margin-bottom: 15px;
        }
        .sync-status {
            font-size: 0.8rem;
            color: #666;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="date" id="world-date">Синхронизация...</div>
    <div class="season" id="world-season">...</div>
    <div class="year-day-sub" id="world-year-day">...</div>
    <div class="weekday" id="world-weekday">...</div>
    <div class="time" id="world-time">--:-- часы</div>
    
    <select id="tz" class="timezone-select" onchange="updateWorldTime()"></select>
    <div class="sync-status" id="sync-status">Сверяю часы с интернет-сервером...</div>
</div>

<script>
    const DAY_MS = 10000000;          
    const YEAR_DAYS = 325;            
    const YEAR_MS = DAY_MS * YEAR_DAYS; 
    const HOUR_MS = 400000; 
    const MINUTE_MS = 8000; 

    const START_REAL_MS = Date.UTC(2026, 6, 14, 0, 0, 0); 
    const VIRTUAL_OFFSET_MS = 6 * YEAR_MS;

    const WEEKDAYS = [
        "Eitejür",
        "Täskörmajür",
        "Vädjastjür (Reeljür)",
        "Kuurajür (Skirajür)",
        "Käźisjür"
    ];

    const SEASONS = [
        "Сезон холодов",       
        "Сезон штормов",       
        "Сезон первых цветов", 
        "Сезон солнца",        
        "Сезон урожая (листопад)" 
    ];

    let timeCorrectionOffset = 0; 

    const select = document.getElementById('tz');
    for (let i = -12; i <= 12; i++) {
        let opt = document.createElement('option');
        opt.value = i;
        let zoneName = "VŚ" + (i > 0 ? `+${i}` : (i < 0 ? `${i}` : ''));
        opt.innerText = zoneName;
        if (i === 0) opt.selected = true; 
        select.appendChild(opt);
    }

    async function syncWithInternet() {
        const statusEl = document.getElementById('sync-status');
        try {
            const response = await fetch('https://worldtimeapi.org/api/timezone/Etc/UTC');
            if (!response.ok) throw new Error();
            
            const data = await response.json();
            const internetTimeMs = data.unixtime * 1000; 
            const deviceTimeMs = Date.now();

            timeCorrectionOffset = internetTimeMs - deviceTimeMs;

            if (Math.abs(timeCorrectionOffset) > 1000) {
                statusEl.innerText = `Синхронизировано по сети. Коррекция ПК: ${(timeCorrectionOffset / 1000).toFixed(1)} сек.`;
                statusEl.style.color = '#ffaa00';
            } else {
                statusEl.innerText = "Синхронизировано по сети. Часы ПК идут точно.";
                statusEl.style.color = '#00ff55';
            }
        } catch (error) {
            statusEl.innerText = "Сервер времени недоступен. Используются часы ПК.";
            statusEl.style.color = '#ff4444';
        }
    }

    function getSeasonInfo(dayOfYear) {
        if (dayOfYear <= 33) {
            return { name: SEASONS[0], day: dayOfYear + 32 };
        } else if (dayOfYear <= 98) {
            return { name: SEASONS[1], day: dayOfYear - 33 };
        } else if (dayOfYear <= 163) {
            return { name: SEASONS[2], day: dayOfYear - 98 };
        } else if (dayOfYear <= 228) {
            return { name: SEASONS[3], day: dayOfYear - 163 };
        } else if (dayOfYear <= 292) {
            return { name: SEASONS[4], day: dayOfYear - 228 };
        } else {
            return { name: SEASONS[0], day: dayOfYear - 292 };
        }
    }

    function updateWorldTime() {
        const accurateNow = Date.now() + timeCorrectionOffset;
        const selectedZone = parseInt(document.getElementById('tz').value) || 0;
        const zoneOffsetMs = selectedZone * HOUR_MS;

        let totalWorldMs = (accurateNow - START_REAL_MS) + VIRTUAL_OFFSET_MS + zoneOffsetMs;

        let currentYear = Math.floor(totalWorldMs / YEAR_MS) + 1;
        let currentDay = Math.floor((totalWorldMs % YEAR_MS) / DAY_MS) + 1;

        if (totalWorldMs < 0) {
            let positiveDays = Math.floor(totalWorldMs / DAY_MS);
            currentYear = Math.floor(positiveDays / YEAR_DAYS) + 7;
            currentDay = (positiveDays % YEAR_DAYS) + YEAR_DAYS + 1;
            if (currentDay > YEAR_DAYS) {
                currentDay -= YEAR_DAYS;
                currentYear += 1;
            }
        }

        const totalDaysFromEpoch = Math.floor(totalWorldMs / DAY_MS);
        const weekdayIndex = ((totalDaysFromEpoch % 5) + 5) % 5;

        const seasonInfo = getSeasonInfo(currentDay);

        let dayProgressMs = ((totalWorldMs % DAY_MS) + DAY_MS) % DAY_MS; 
        const currentHour = Math.floor(dayProgressMs / HOUR_MS);

        const hourProgressMs = dayProgressMs % HOUR_MS;
        const currentMinute = Math.floor(hourProgressMs / MINUTE_MS);

        const displayHour = currentHour.toString().padStart(2, '0');
        const displayMinute = currentMinute.toString().padStart(2, '0');

        // Сначала день сезона, потом год
        document.getElementById('world-date').innerText = `${seasonInfo.day}-й день сезона, ${currentYear} год`;
        document.getElementById('world-season').innerText = seasonInfo.name;
        document.getElementById('world-year-day').innerText = `День ${currentDay} из ${YEAR_DAYS} в году`;
        document.getElementById('world-weekday').innerText = WEEKDAYS[weekdayIndex];
        document.getElementById('world-time').innerText = `${displayHour}:${displayMinute} часы`;
    }

    updateWorldTime();
    setInterval(updateWorldTime, 100);
    syncWithInternet();
    setInterval(syncWithInternet, 600000); 
</script>

</body>
</html>
