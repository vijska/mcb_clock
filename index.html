<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Часы Маня-КБ</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Тёмная тема (по умолчанию) */
        :root {
            --bg-color: #0f0f11;
            --card-bg: #18181c;
            --card-border: #2a2a30;
            --title-color: #6e6e7a;
            --primary-text: #f0f0f2;
            --secondary-text: #adadb8;
            --sub-text: #585863;
            --select-bg: #222228;
            --select-border: #33333d;
            --button-bg: #222228;
            --button-active-bg: #3a3a46;
            --button-active-text: #ffffff;
            --shadow: rgba(0, 0, 0, 0.25);
            --dial-tick-major: #8e8e9a;
            --dial-tick-minor: #3a3a44;
            --hand-hour: #f0f0f2;
            --hand-minute: #adadb8;
            --hand-second: #e55353;
        }

        /* Светлая тема */
        [data-theme="light"] {
            --bg-color: #f4f4f6;
            --card-bg: #ffffff;
            --card-border: #e1e1e8;
            --title-color: #8e8e9a;
            --primary-text: #1a1a1e;
            --secondary-text: #4a4a52;
            --sub-text: #8a8a96;
            --select-bg: #f0f0f4;
            --select-border: #d1d1d9;
            --button-bg: #eaeaea;
            --button-active-bg: #1a1a1e;
            --button-active-text: #ffffff;
            --shadow: rgba(0, 0, 0, 0.05);
            --dial-tick-major: #5a5a66;
            --dial-tick-minor: #d1d1d9;
            --hand-hour: #1a1a1e;
            --hand-minute: #5a5a66;
            --hand-second: #d93838;
        }

        body {
            background-color: var(--bg-color);
            color: var(--primary-text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        .clock-wrapper {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .segment {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px 24px;
            text-align: center;
            box-shadow: 0 4px 20px var(--shadow);
            transition: background-color 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
        }

        .segment-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--title-color);
            margin-bottom: 12px;
            font-weight: 600;
        }

        .analog-clock-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 12px;
        }

        .analog-clock {
            width: 280px;
            height: 280px;
            position: relative;
            border-radius: 50%;
        }

        .time-display {
            font-family: "SF Mono", "Roboto Mono", "Courier New", monospace;
            font-size: clamp(2.2rem, 7vw, 3.5rem);
            font-weight: 700;
            color: var(--primary-text);
            line-height: 1.1;
            letter-spacing: -0.02em;
        }

        .date-primary {
            font-size: clamp(1.1rem, 3.5vw, 1.45rem);
            font-weight: 600;
            color: var(--primary-text);
            margin-bottom: 6px;
        }

        .year-display {
            font-size: 1.05rem;
            color: var(--secondary-text);
            font-weight: 500;
        }

        .year-day-sub {
            font-size: 0.8rem;
            color: var(--sub-text);
            margin-top: 6px;
        }

        .weekday-display {
            font-size: 1.25rem;
            font-weight: 500;
            color: var(--secondary-text);
        }

        .settings-segment {
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
            max-width: 380px;
            align-items: center;
        }

        .control-label {
            font-size: 0.75rem;
            color: var(--sub-text);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .tab-switcher {
            display: flex;
            background: var(--select-bg);
            border: 1px solid var(--select-border);
            border-radius: 8px;
            padding: 3px;
            width: 100%;
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--secondary-text);
            padding: 6px 8px;
            font-size: 0.78rem;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: var(--button-active-bg);
            color: var(--button-active-text);
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }

        .sync-box {
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: center;
        }

        .sync-status {
            font-size: 0.82rem;
            font-weight: 500;
        }

        .sync-detail {
            font-size: 0.72rem;
            color: var(--sub-text);
        }

        @media (min-width: 540px) {
            .grid-row {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 16px;
            }
        }
    </style>
</head>
<body>

<div class="clock-wrapper">
    <div class="segment" id="time-segment">
        <div class="segment-title">Время</div>

        <div class="analog-clock-container" id="analog-clock-box">
            <svg class="analog-clock" viewBox="0 0 300 300" id="clock-svg">
                <g id="clock-ticks"></g>
                <g id="clock-labels"></g>

                <line id="hand-hour" x1="150" y1="150" x2="150" y2="85"
                      stroke="var(--hand-hour)" stroke-width="5.5" stroke-linecap="round" />
                <line id="hand-minute" x1="150" y1="150" x2="150" y2="55"
                      stroke="var(--hand-minute)" stroke-width="3.5" stroke-linecap="round" />
                <line id="hand-second" x1="150" y1="165" x2="150" y2="42"
                      stroke="var(--hand-second)" stroke-width="1.8" stroke-linecap="round" />

                <circle cx="150" cy="150" r="5" fill="var(--hand-second)" />
                <circle cx="150" cy="150" r="2" fill="var(--card-bg)" />
            </svg>
        </div>

        <div class="time-display" id="world-time">--:--:--</div>
    </div>

    <div class="grid-row">
        <div class="segment">
            <div class="segment-title">Дата и Сезон</div>
            <div class="date-primary" id="world-date">Загрузка...</div>
            <div class="year-display" id="world-year">...</div>
            <div class="year-day-sub" id="world-year-day">...</div>
        </div>

        <div class="segment" style="display: flex; flex-direction: column; justify-content: center;">
            <div class="segment-title">День недели</div>
            <div class="weekday-display" id="world-weekday">...</div>
        </div>
    </div>

    <div class="segment settings-segment">
        <div class="segment-title">Настройки и Синхронизация</div>

        <div class="control-group">
            <div class="control-label">Отображение времени</div>
            <div class="tab-switcher">
                <button class="tab-btn active" id="display-both" onclick="setTimeDisplayMode('both')">Все</button>
                <button class="tab-btn" id="display-analog" onclick="setTimeDisplayMode('analog')">Аналоговые</button>
                <button class="tab-btn" id="display-digital" onclick="setTimeDisplayMode('digital')">Цифровые</button>
            </div>
        </div>

        <div class="control-group">
            <div class="control-label">Оформление</div>
            <div class="tab-switcher">
                <button class="tab-btn active" id="theme-auto" onclick="setThemeMode('auto')">Адаптивная</button>
                <button class="tab-btn" id="theme-dark" onclick="setThemeMode('dark')">Тёмная</button>
                <button class="tab-btn" id="theme-light" onclick="setThemeMode('light')">Светлая</button>
            </div>
        </div>

        <div class="sync-box">
            <div class="sync-status" id="sync-status">Автономный режим</div>
            <div class="sync-detail" id="sync-detail">Используются системные часы устройства</div>
        </div>
    </div>
</div>

<script>
    /* =========================================================
       КОНСТАНТЫ КАЛЕНДАРЯ И ЧАСОВ
       ========================================================= */
    const DAY_MS = 10000000;               // 1 "виртуальный" день = 10 000 000 мс
    const YEAR_DAYS = 325;                 // дней в году
    const YEAR_MS = DAY_MS * YEAR_DAYS;

    const HOUR_MS = 500000;                // 1 виртуальный час
    const MINUTE_MS = 5000;                // 1 виртуальная минута
    const SECOND_MS = 50;                  // 1 виртуальная секунда

    const START_REAL_MS = Date.UTC(2026, 6, 14, 0, 0, 0); // точка отсчёта (реальное UTC)
    const VIRTUAL_OFFSET_MS = 6 * YEAR_MS;                // виртуальный сдвиг

    const WEEKDAYS = [
        "Eitejür",
        "Täskörmäjur",
        "Vädjastjür (Reeljür)",
        "Kuurajür (Skirajür)",
        "Käźisjür"
    ];

    const SEASONS_GENITIVE = [
        "сесона холодов",
        "сесона штормов",
        "сесона первых цветов",
        "сесона солнца",
        "сесона урожая (листопада)"
    ];

    /* =========================================================
       СОСТОЯНИЕ
       ========================================================= */
    let timeCorrectionOffset = 0;   // поправка к Date.now() в мс
    let currentThemeMode = 'auto';
    let timeDisplayMode = 'both';
    let lastCalculatedHour = 10;

    /* =========================================================
       ОТРИСОВКА ЦИФЕРБЛАТА
       ========================================================= */
    function renderClockFace() {
        const ticksGroup = document.getElementById('clock-ticks');
        const labelsGroup = document.getElementById('clock-labels');
        ticksGroup.innerHTML = '';
        labelsGroup.innerHTML = '';

        const cx = 150, cy = 150;
        const outerR = 138;

        for (let i = 0; i < 100; i++) {
            const angleDeg = i * 3.6;
            const angleRad = (angleDeg - 90) * (Math.PI / 180);

            const isMajor = (i % 5 === 0);
            const tickLen = isMajor ? 12 : 5;
            const strokeColor = isMajor ? "var(--dial-tick-major)" : "var(--dial-tick-minor)";
            const strokeWidth = isMajor ? 2.5 : 1;

            const x1 = cx + (outerR - tickLen) * Math.cos(angleRad);
            const y1 = cy + (outerR - tickLen) * Math.sin(angleRad);
            const x2 = cx + outerR * Math.cos(angleRad);
            const y2 = cy + outerR * Math.sin(angleRad);

            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", x1);
            line.setAttribute("y1", y1);
            line.setAttribute("x2", x2);
            line.setAttribute("y2", y2);
            line.setAttribute("stroke", strokeColor);
            line.setAttribute("stroke-width", strokeWidth);
            line.setAttribute("stroke-linecap", "round");
            ticksGroup.appendChild(line);

            if (isMajor) {
                const hourIndex = i / 5;
                let hourNum = (hourIndex + 10) % 20;
                if (hourNum === 0) hourNum = 20;

                const labelR = outerR - 24;
                const lx = cx + labelR * Math.cos(angleRad);
                const ly = cy + labelR * Math.sin(angleRad);

                const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                text.setAttribute("x", lx);
                text.setAttribute("y", ly + 4);
                text.setAttribute("fill", "var(--primary-text)");
                text.setAttribute("font-size", "11");
                text.setAttribute("font-weight", "600");
                text.setAttribute("font-family", "-apple-system, sans-serif");
                text.setAttribute("text-anchor", "middle");
                text.textContent = hourNum;
                labelsGroup.appendChild(text);
            }
        }
    }

    /* =========================================================
       ПЕРЕКЛЮЧАТЕЛИ UI
       ========================================================= */
    function setTimeDisplayMode(mode) {
        timeDisplayMode = mode;
        ['both', 'analog', 'digital'].forEach(m => {
            const btn = document.getElementById(`display-${m}`);
            if (m === mode) btn.classList.add('active');
            else btn.classList.remove('active');
        });

        const analogBox = document.getElementById('analog-clock-box');
        const digitalBox = document.getElementById('world-time');

        if (mode === 'both') {
            analogBox.style.display = 'flex';
            digitalBox.style.display = 'block';
        } else if (mode === 'analog') {
            analogBox.style.display = 'flex';
            digitalBox.style.display = 'none';
        } else if (mode === 'digital') {
            analogBox.style.display = 'none';
            digitalBox.style.display = 'block';
        }
    }

    function setThemeMode(mode) {
        currentThemeMode = mode;
        ['auto', 'dark', 'light'].forEach(m => {
            const btn = document.getElementById(`theme-${m}`);
            if (m === mode) btn.classList.add('active');
            else btn.classList.remove('active');
        });
        applyTheme(lastCalculatedHour);
    }

    function applyTheme(hour) {
        let effectiveTheme = currentThemeMode;
        if (currentThemeMode === 'auto') {
            effectiveTheme = (hour >= 5 && hour <= 16) ? 'light' : 'dark';
        }
        document.body.setAttribute('data-theme', effectiveTheme);
    }

    /* =========================================================
       СИНХРОНИЗАЦИЯ ПО ЗАГОЛОВКАМ Date
       =========================================================
       Любой HTTP-ответ содержит заголовок Date (GMT, точность 1 сек).
       Заголовок Date входит в CORS-safelisted response headers, поэтому
       доступен из JS даже для cross-origin запросов.
       Компенсируем RTT: серверное время сопоставляем со серединой
       интервала (t0 + t1) / 2.
    */
    function fetchTimeFromHeaders(url, useHead) {
        const t0 = Date.now();
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 5000);

        const opts = {
            method: useHead ? 'HEAD' : 'GET',
            cache: 'no-store',
            signal: controller.signal
        };

        return fetch(url, opts)
            .then(res => {
                clearTimeout(timeoutId);
                const t1 = Date.now();
                const dateHeader = res.headers.get('date');
                if (!dateHeader) throw new Error('No Date header from ' + url);
                const serverTime = new Date(dateHeader).getTime();
                if (isNaN(serverTime)) throw new Error('Bad Date header from ' + url);
                const localMid = (t0 + t1) / 2;
                return {
                    name: new URL(url, location.href).hostname,
                    time: serverTime,
                    localMid,
                    rtt: t1 - t0
                };
            })
            .catch(err => {
                clearTimeout(timeoutId);
                throw err;
            });
    }

    /* Резервный JSON-источник (точнее, но менее доступен) */
    function fetchSingleJsonTime(url, parseFn) {
        const t0 = Date.now();
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 5000);

        return fetch(url, { signal: controller.signal, cache: 'no-store' })
            .then(res => {
                clearTimeout(timeoutId);
                if (!res.ok) throw new Error("HTTP " + res.status);
                return res.json();
            })
            .then(data => {
                const t1 = Date.now();
                const parsed = parseFn(data);
                return {
                    name: parsed.name,
                    time: parsed.time,
                    localMid: (t0 + t1) / 2,
                    rtt: t1 - t0
                };
            });
    }

    function syncWithInternet() {
        const statusEl = document.getElementById('sync-status');
        const detailEl = document.getElementById('sync-detail');

        /* Same-origin запрос — самый надёжный, не зависит от CORS. */
        const sameOrigin = location.origin + location.pathname;

        const headerRequests = [
            fetchTimeFromHeaders(sameOrigin, true),                                  // сам GitHub Pages
            fetchTimeFromHeaders('https://cloudflare.com/cdn-cgi/trace', false),     // Cloudflare
            fetchTimeFromHeaders('https://www.google.com/generate_204', false),      // Google
            fetchTimeFromHeaders('https://www.apple.com/', true)                     // Apple
        ];

        const jsonRequests = [
            fetchSingleJsonTime('https://worldtimeapi.org/api/timezone/Etc/UTC',
                d => ({ name: 'WorldTimeAPI', time: d.unixtime * 1000 })),
            fetchSingleJsonTime('https://timeapi.io/api/v1/time/current/zone?timeZone=UTC',
                d => ({ name: 'TimeAPI', time: new Date(d.dateTime + "Z").getTime() }))
        ];

        Promise.any([...headerRequests, ...jsonRequests])
            .then(result => {
                /* Корректировка: сравниваем серверное время с локальным
                   в момент генерации ответа (localMid), а не с Date.now() */
                timeCorrectionOffset = result.time - result.localMid;
                const diffMs = timeCorrectionOffset;
                const diffSec = (diffMs / 1000).toFixed(1);

                if (Math.abs(diffMs) > 1000) {
                    statusEl.innerText = `Синхронизировано (${result.name})`;
                    statusEl.style.color = '#d49b4b';
                    detailEl.innerText = `Погрешность: ${diffSec} сек, RTT ${result.rtt} мс`;
                } else {
                    statusEl.innerText = 'Синхронизировано по сети';
                    statusEl.style.color = '#52ab6a';
                    detailEl.innerText = `Источник: ${result.name} (часы точные), RTT ${result.rtt} мс`;
                }
            })
            .catch(err => {
                timeCorrectionOffset = 0;
                statusEl.innerText = 'Автономный режим';
                statusEl.style.color = '#8e8e9a';
                detailEl.innerText = 'Все источники времени недоступны';
                console.warn('Time sync failed:', err);
            });
    }

    /* =========================================================
       СЕЗОНЫ
       ========================================================= */
    function getSeasonInfo(dayOfYear) {
        if (dayOfYear <= 33) {
            return { name: SEASONS_GENITIVE[0], day: dayOfYear + 32 };
        } else if (dayOfYear <= 98) {
            return { name: SEASONS_GENITIVE[1], day: dayOfYear - 33 };
        } else if (dayOfYear <= 163) {
            return { name: SEASONS_GENITIVE[2], day: dayOfYear - 98 };
        } else if (dayOfYear <= 228) {
            return { name: SEASONS_GENITIVE[3], day: dayOfYear - 163 };
        } else if (dayOfYear <= 292) {
            return { name: SEASONS_GENITIVE[4], day: dayOfYear - 228 };
        } else {
            return { name: SEASONS_GENITIVE[0], day: dayOfYear - 292 };
        }
    }

    /* =========================================================
       ОБНОВЛЕНИЕ ВРЕМЕНИ
       ========================================================= */
    function updateWorldTime() {
        const accurateNow = Date.now() + timeCorrectionOffset;
        let totalWorldMs = (accurateNow - START_REAL_MS) + VIRTUAL_OFFSET_MS;

        let currentYear = Math.floor(totalWorldMs / YEAR_MS) + 1;
        let currentDay = Math.floor((totalWorldMs % YEAR_MS) / DAY_MS) + 1;

        if (totalWorldMs < 0) {
            let positiveDays = Math.floor(totalWorldMs / DAY_MS);
            currentYear = Math.floor(positiveDays / YEAR_DAYS) + 7;
            currentDay = (positiveDays % YEAR_DAYS) + YEAR_DAYS + 1;
            if (currentDay > YEAR_DAYS) {
                currentDay -= YEAR_DAYS;
                currentYear += 1;
            }
        }

        const totalDaysFromEpoch = Math.floor(totalWorldMs / DAY_MS);
        const weekdayIndex = ((totalDaysFromEpoch % 5) + 5) % 5;

        const seasonInfo = getSeasonInfo(currentDay);

        let dayProgressMs = ((totalWorldMs % DAY_MS) + DAY_MS) % DAY_MS;

        const currentHour = Math.floor(dayProgressMs / HOUR_MS);

        const hourProgressMs = dayProgressMs % HOUR_MS;
        const currentMinute = Math.floor(hourProgressMs / MINUTE_MS);

        const minuteProgressMs = hourProgressMs % MINUTE_MS;
        const currentSecond = Math.floor(minuteProgressMs / SECOND_MS);

        const displayHour = currentHour.toString().padStart(2, '0');
        const displayMinute = currentMinute.toString().padStart(2, '0');
        const displaySecond = currentSecond.toString().padStart(2, '0');

        lastCalculatedHour = currentHour;
        applyTheme(currentHour);

        const hourRatio = dayProgressMs / DAY_MS;
        const minuteRatio = hourProgressMs / HOUR_MS;
        const secondRatio = minuteProgressMs / MINUTE_MS;

        const hourAngle = (hourRatio * 360 - 180) % 360;
        const minuteAngle = minuteRatio * 360;
        const secondAngle = secondRatio * 360;

        document.getElementById('hand-hour').setAttribute('transform', `rotate(${hourAngle} 150 150)`);
        document.getElementById('hand-minute').setAttribute('transform', `rotate(${minuteAngle} 150 150)`);
        document.getElementById('hand-second').setAttribute('transform', `rotate(${secondAngle} 150 150)`);

        document.getElementById('world-date').innerText = `${seasonInfo.day}-ый день ${seasonInfo.name}`;
        document.getElementById('world-year').innerText = `${currentYear} год`;
        document.getElementById('world-year-day').innerText = `Порядковый день: ${currentDay} из ${YEAR_DAYS}`;
        document.getElementById('world-weekday').innerText = WEEKDAYS[weekdayIndex];
        document.getElementById('world-time').innerText = `${displayHour}:${displayMinute}:${displaySecond}`;
    }

    /* =========================================================
       ИНИЦИАЛИЗАЦИЯ
       ========================================================= */
    renderClockFace();
    updateWorldTime();

    // Запускаем синхронизацию по заголовкам Date (сначала локально, потом внешне)
    syncWithInternet();

    // Обновляем время каждые 50 мс (это 1 виртуальная секунда)
    setInterval(updateWorldTime, 50);

    // Повторная синхронизация раз в 5 минут
    setInterval(syncWithInternet, 5 * 60 * 1000);
</script>
</body>
</html>
