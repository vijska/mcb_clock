<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Часы Вымышленного Мира</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Тёмная тема (по умолчанию) */
        :root {
            --bg-color: #0f0f11;
            --card-bg: #18181c;
            --card-border: #2a2a30;
            --title-color: #6e6e7a;
            --primary-text: #f0f0f2;
            --secondary-text: #adadb8;
            --sub-text: #585863;
            --select-bg: #222228;
            --select-border: #33333d;
            --button-bg: #222228;
            --button-active-bg: #3a3a46;
            --button-active-text: #ffffff;
            --shadow: rgba(0, 0, 0, 0.25);
        }

        /* Светлая тема */
        [data-theme="light"] {
            --bg-color: #f4f4f6;
            --card-bg: #ffffff;
            --card-border: #e1e1e8;
            --title-color: #8e8e9a;
            --primary-text: #1a1a1e;
            --secondary-text: #4a4a52;
            --sub-text: #8a8a96;
            --select-bg: #f0f0f4;
            --select-border: #d1d1d9;
            --button-bg: #eaeaea;
            --button-active-bg: #1a1a1e;
            --button-active-text: #ffffff;
            --shadow: rgba(0, 0, 0, 0.05);
        }

        body {
            background-color: var(--bg-color);
            color: var(--primary-text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        .clock-wrapper {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .segment {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px 24px;
            text-align: center;
            box-shadow: 0 4px 20px var(--shadow);
            transition: background-color 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
        }

        .segment-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--title-color);
            margin-bottom: 8px;
            font-weight: 600;
        }

        /* Сегмент времени */
        .time-display {
            font-family: "SF Mono", "Roboto Mono", "Courier New", monospace;
            font-size: clamp(2.5rem, 8vw, 3.8rem);
            font-weight: 700;
            color: var(--primary-text);
            line-height: 1.1;
            letter-spacing: -0.02em;
        }

        /* Сегмент даты и сезона */
        .date-primary {
            font-size: clamp(1.1rem, 3.5vw, 1.45rem);
            font-weight: 600;
            color: var(--primary-text);
            margin-bottom: 6px;
        }

        .year-display {
            font-size: 1.05rem;
            color: var(--secondary-text);
            font-weight: 500;
        }

        .year-day-sub {
            font-size: 0.8rem;
            color: var(--sub-text);
            margin-top: 6px;
        }

        /* Сегмент дня недели */
        .weekday-display {
            font-size: 1.25rem;
            font-weight: 500;
            color: var(--secondary-text);
        }

        /* Сегмент настроек */
        .settings-segment {
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
            max-width: 320px;
            align-items: center;
        }

        .control-label {
            font-size: 0.75rem;
            color: var(--sub-text);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Переключатель темы (табы) */
        .theme-switcher {
            display: flex;
            background: var(--select-bg);
            border: 1px solid var(--select-border);
            border-radius: 8px;
            padding: 3px;
            width: 100%;
        }

        .theme-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--secondary-text);
            padding: 6px 10px;
            font-size: 0.82rem;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .theme-btn.active {
            background: var(--button-active-bg);
            color: var(--button-active-text);
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }

        .timezone-select {
            background: var(--select-bg);
            color: var(--primary-text);
            border: 1px solid var(--select-border);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
            width: 100%;
            font-family: inherit;
            transition: border-color 0.2s, background 0.2s;
        }

        .sync-box {
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: center;
        }

        .sync-status {
            font-size: 0.82rem;
            font-weight: 500;
        }

        .sync-detail {
            font-size: 0.72rem;
            color: var(--sub-text);
        }

        @media (min-width: 540px) {
            .grid-row {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 16px;
            }
        }
    </style>
</head>
<body>

<div class="clock-wrapper">
    <!-- Время -->
    <div class="segment">
        <div class="segment-title">Время</div>
        <div class="time-display" id="world-time">--:--:--</div>
    </div>

    <!-- Адаптивная сетка -->
    <div class="grid-row">
        <!-- Дата и Сезон -->
        <div class="segment">
            <div class="segment-title">Дата и Сезон</div>
            <div class="date-primary" id="world-date">Синхронизация...</div>
            <div class="year-display" id="world-year">...</div>
            <div class="year-day-sub" id="world-year-day">...</div>
        </div>

        <!-- День недели -->
        <div class="segment" style="display: flex; flex-direction: column; justify-content: center;">
            <div class="segment-title">День недели</div>
            <div class="weekday-display" id="world-weekday">...</div>
        </div>
    </div>

    <!-- Настройки -->
    <div class="segment settings-segment">
        <div class="segment-title">Настройки и Синхронизация</div>
        
        <!-- Выбор темы -->
        <div class="control-group">
            <div class="control-label">Оформление</div>
            <div class="theme-switcher">
                <button class="theme-btn active" id="theme-auto" onclick="setThemeMode('auto')">Адаптивная</button>
                <button class="theme-btn" id="theme-dark" onclick="setThemeMode('dark')">Тёмная</button>
                <button class="theme-btn" id="theme-light" onclick="setThemeMode('light')">Светлая</button>
            </div>
        </div>

        <!-- Часовой пояс -->
        <div class="control-group">
            <div class="control-label">Часовой пояс</div>
            <select id="tz" class="timezone-select" onchange="updateWorldTime()"></select>
        </div>

        <!-- Блок со статусом и деталями подключения -->
<div class="sync-box">
            <div class="sync-status" id="sync-status">Сверяю часы по опорным источникам...</div>
            <div class="sync-detail" id="sync-detail">Метод калибровки: не определен</div>
        </div>
    </div>
</div>

<script>
    /* -------------------------------------------------------------
       НОВАЯ СИСТЕМА ВРЕМЕНИ:
       1 день = 20 часов
       1 час  = 100 минут
       1 минута = 100 секунд
       Итого: 1 день = 200 000 секунд
       1 день в реальных мс = 10 000 000 мс (как и прежде)
       1 секунда = 50 мс (10 000 000 / 200 000)
       1 минута  = 5 000 мс
       1 час     = 500 000 мс
    ------------------------------------------------------------- */
    const DAY_MS = 10000000;          
    const YEAR_DAYS = 325;            
    const YEAR_MS = DAY_MS * YEAR_DAYS; 
    
    const HOUR_MS = 500000;   // 10 000 000 / 20
    const MINUTE_MS = 5000;   // 500 000 / 100
    const SECOND_MS = 50;     // 5 000 / 100

    const START_REAL_MS = Date.UTC(2026, 6, 14, 0, 0, 0); 
    const VIRTUAL_OFFSET_MS = 6 * YEAR_MS;

    const WEEKDAYS = [
        "Eitejür",
        "Täskörmajür",
        "Vädjastjür (Reeljür)",
        "Kuurajür (Skirajür)",
        "Käźisjür"
    ];

    // Названия сезонов в родительном падеже для строки "... день [сезона]"
    const SEASONS_GENITIVE = [
        "сезона холодов",       
        "сезона штормов",       
        "сезона первых цветов", 
        "сезона солнца",        
        "сезона урожая (листопада)" 
    ];

    // Многоуровневый массив источников калибровки
    const TIME_SOURCES = [
        {
            name: "Сервер хостинга (HTTP HEAD)",
            method: "Заголовок Date собственного сервера",
            fetchTime: async () => {
                const res = await fetch(window.location.href + '?t=' + Date.now(), { method: 'HEAD', cache: 'no-store' });
                const dateStr = res.headers.get('date');
                if (!dateStr) throw new Error("Заголовок Date отсутствует");
                return new Date(dateStr).getTime();
            }
        },
        {
            name: "Cloudflare CDN",
            method: "Трассировка Cloudflare (/cdn-cgi/trace)",
            fetchTime: async () => {
                const res = await fetch('https://1.1.1.1/cdn-cgi/trace');
                const text = await res.text();
                const match = text.match(/ts=(\d+\.\d+|\d+)/);
                if (!match) throw new Error("Не удалось разобрать ответы Cloudflare");
                return Math.floor(parseFloat(match[1]) * 1000);
            }
        },
        {
            name: "WorldTimeAPI",
            method: "REST API (worldtimeapi.org)",
            fetchTime: async () => {
                const res = await fetch('https://worldtimeapi.org/api/timezone/Etc/UTC');
                const data = await res.json();
                return data.unixtime * 1000;
            }
        },
        {
            name: "TimeAPI",
            method: "REST API (timeapi.io)",
            fetchTime: async () => {
                const res = await fetch('https://timeapi.io/api/v1/time/current/zone?timeZone=UTC');
                const data = await res.json();
                return new Date(data.dateTime + "Z").getTime();
            }
        }
    ];

    let timeCorrectionOffset = 0; 
    let currentThemeMode = 'auto'; // 'auto', 'dark', 'light'
    let lastCalculatedHour = 10;

    const select = document.getElementById('tz');
    for (let i = -12; i <= 12; i++) {
        let opt = document.createElement('option');
        opt.value = i;
        let zoneName = "VŚ" + (i > 0 ? +${i} : (i < 0 ? ${i} : ''));
        opt.innerText = zoneName;
        if (i === 0) opt.selected = true; 
        select.appendChild(opt);
    }

    function setThemeMode(mode) {
        currentThemeMode = mode;
        ['auto', 'dark', 'light'].forEach(m => {
            const btn = document.getElementById(theme-${m});
            if (m === mode) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
        applyTheme(lastCalculatedHour);
    }

    function applyTheme(hour) {
        let effectiveTheme = currentThemeMode;
        if (currentThemeMode === 'auto') {
            // В системе из 20 часов день — с 5 до 16 часа
            if (hour >= 5 && hour <= 16) {
                effectiveTheme = 'light';
            } else {
                effectiveTheme = 'dark';
            }
        }
        document.body.setAttribute('data-theme', effectiveTheme);
    }

    async function syncWithInternet() {
        const statusEl = document.getElementById('sync-status');
        const detailEl = document.getElementById('sync-detail');
        let synced = false;

        for (const source of TIME_SOURCES) {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 3000);

                const internetTimeMs = await source.fetchTime();
                clearTimeout(timeoutId);

                const deviceTimeMs = Date.now();
                timeCorrectionOffset = internetTimeMs - deviceTimeMs;
                synced = true;

                if (Math.abs(timeCorrectionOffset) > 1000) {
                    statusEl.innerText = Синхронизировано (${source.name});
                    statusEl.style.color = '#d49b4b';
                    detailEl.innerText = Подключение: ${source.method} | Погрешность ПК: ${(timeCorrectionOffset / 1000).toFixed(1)} сек.;
                } else {
                    statusEl.innerText = Синхронизировано по сети;
                    statusEl.style.color = '#52ab6a';
                    detailEl.innerText = Подключение: ${source.method} (точный системный ход);
                }

                break;
            } catch (error) {
                console.warn(Источник ${source.name} недоступен:, error);
            }
        }

        if (!synced) {
            statusEl.innerText = "Все внешние серверы недоступны";
            statusEl.style.color = '#c95353';
            detailEl.innerText = "Подключение: автономный режим (часы ПК)";
        }
    }

    function getSeasonInfo(dayOfYear) {
        if (dayOfYear <= 33) {
            return { name: SEASONS_GENITIVE[0], day: dayOfYear + 32 };
        } else if (dayOfYear <= 98) {
            return { name: SEASONS_GENITIVE[1], day: dayOfYear - 33 };
        } else if (dayOfYear <= 163) {
            return { name: SEASONS_GENITIVE[2], day: dayOfYear - 98 };
        } else if (dayOfYear <= 228) {
            return { name: SEASONS_GENITIVE[3], day: dayOfYear - 163 };
        } else if (dayOfYear <= 292) {
            return { name: SEASONS_GENITIVE[4], day: dayOfYear - 228 };
        } else {
            return { name: SEASONS_GENITIVE[0], day: dayOfYear - 292 };
        }
    }

    function updateWorldTime() {
        const accurateNow = Date.now() + timeCorrectionOffset;
        const selectedZone = parseInt(document.getElementById('tz').value) || 0;
        const zoneOffsetMs = selectedZone * HOUR_MS;

        let totalWorldMs = (accurateNow - START_REAL_MS) + VIRTUAL_OFFSET_MS + zoneOffsetMs;

        let currentYear = Math.floor(totalWorldMs / YEAR_MS) + 1;
        let currentDay = Math.floor((totalWorldMs % YEAR_MS) / DAY_MS) + 1;

        if (totalWorldMs < 0) {
            let positiveDays = Math.floor(totalWorldMs / DAY_MS);
            currentYear = Math.floor(positiveDays / YEAR_DAYS) + 7;
            currentDay = (positiveDays % YEAR_DAYS) + YEAR_DAYS + 1;
            if (currentDay > YEAR_DAYS) {
                currentDay -= YEAR_DAYS;
                currentYear += 1;
            }
        }

        const totalDaysFromEpoch = Math.floor(totalWorldMs / DAY_MS);
        const weekdayIndex = ((totalDaysFromEpoch % 5) + 5) % 5;

        const seasonInfo = getSeasonInfo(currentDay);

        let dayProgressMs = ((totalWorldMs % DAY_MS) + DAY_MS) % DAY_MS;
